<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #fffaf3;
      color: #1c1917;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #fffaf3; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 600px;
              background: #ffffff;
              border: 1px solid #e7e5e4;
              border-radius: 16px;
              overflow: hidden;
            "
          >
            <tr>
              <td style="background: #3f7d5a; padding: 20px 28px; color: #ffffff">
                <div
                  style="
                    font-size: 12px;
                    font-weight: 700;
                    letter-spacing: 1.5px;
                    text-transform: uppercase;
                  "
                >
                  Người Việt SJ Events
                </div>
                <div style="font-size: 24px; font-weight: 700; margin-top: 6px">
                  Payment confirmed
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px">
                <p style="margin: 0 0 16px; font-size: 16px">Hi {{full_name}},</p>
                <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.6; color: #57534e">
                  Your payment for <strong>{{event_title}}</strong> has been confirmed.
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="border-collapse: collapse; font-size: 14px"
                >
                  <tr>
                    <td style="padding: 10px 0; border-bottom: 1px solid #e7e5e4; color: #57534e">
                      Registration ID
                    </td>
                    <td
                      style="
                        padding: 10px 0;
                        border-bottom: 1px solid #e7e5e4;
                        text-align: right;
                        font-family: monospace;
                      "
                    >
                      {{registration_id}}
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 10px 0; border-bottom: 1px solid #e7e5e4; color: #57534e">
                      Amount paid
                    </td>
                    <td
                      style="
                        padding: 10px 0;
                        border-bottom: 1px solid #e7e5e4;
                        text-align: right;
                        font-weight: 700;
                      "
                    >
                      {{amount}}
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 10px 0; border-bottom: 1px solid #e7e5e4; color: #57534e">
                      Method
                    </td>
                    <td
                      style="padding: 10px 0; border-bottom: 1px solid #e7e5e4; text-align: right"
                    >
                      {{method}}
                    </td>
                  </tr>
                </table>
                <div style="margin: 24px 0; text-align: center">
                  <div style="font-size: 15px; font-weight: 700; margin-bottom: 12px">
                    Your check-in QR code
                  </div>
                  <img
                    src="cid:{{qr_content_id}}"
                    alt="Check-in QR code"
                    width="220"
                    height="220"
                    style="
                      display: block;
                      margin: 0 auto;
                      border: 1px solid #e7e5e4;
                      border-radius: 12px;
                      padding: 12px;
                      background: #ffffff;
                    "
                  />
                  <p style="margin: 12px 0 0; font-size: 13px; line-height: 1.5; color: #57534e">
                    Show this code at the event entrance.
                  </p>
                </div>
                <p style="margin: 0; text-align: center">
                  <a
                    href="{{status_url}}"
                    style="
                      display: inline-block;
                      background: #b63817;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: 700;
                      font-size: 15px;
                      padding: 13px 22px;
                      border-radius: 999px;
                    "
                    >View registration status</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
