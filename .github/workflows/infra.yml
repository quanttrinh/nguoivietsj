name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan only, or plan and apply the saved plan"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

concurrency:
  group: infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-deps
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
      - name: OpenTofu format check
        run: tofu fmt -check -recursive infra
      - name: OpenTofu validate
        working-directory: infra/cloudflare
        run: |
          tofu init -backend=false -input=false
          tofu validate

  plan:
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-deps
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
      - name: Write Terraform variables
        working-directory: infra/cloudflare
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
        run: doppler secrets get TERRAFORM_TFVARS --plain > terraform.tfvars.json
      - name: Plan
        working-directory: infra/cloudflare
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
        run: |
          doppler run -- tofu init -input=false
          doppler run -- tofu plan -input=false -lock-timeout=5m -out=cloudflare.tfplan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloudflare-plan
          path: infra/cloudflare/cloudflare.tfplan
          retention-days: 7

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && inputs.mode == 'apply'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-deps
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cloudflare-plan
          path: infra/cloudflare
      - name: Apply
        working-directory: infra/cloudflare
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
        run: |
          doppler run -- tofu init -input=false
          doppler run -- tofu apply -input=false -lock-timeout=5m cloudflare.tfplan
