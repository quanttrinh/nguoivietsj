name: CI

permissions:
  contents: read
  checks: write
  pull-requests: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Generated drift
        run: |
          yarn codegen
          git diff --exit-code -- src/generated
          test -z "$(git status --porcelain --untracked-files=all -- src/generated)"
      - name: Build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
        run: doppler run -- yarn astro build
      - name: Schema drift
        run: |
          yarn auth:schema
          yarn db:migrations:app
          yarn db:migrations:events
          git diff --exit-code -- drizzle
          test -z "$(git status --porcelain --untracked-files=all -- drizzle)"
          git diff --exit-code -- src/platform/server/db/app/schemas/auth-schema.ts
          yarn drizzle-kit check --config=drizzle.events.config.ts
          yarn drizzle-kit check --config=drizzle.app.config.ts
      - name: Test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn vitest run --changed "${{ github.event.pull_request.base.sha }}"
          else
            yarn test
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vitest-reports
          path: reports
          retention-days: 7
      - name: Publish test report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6
        with:
          report_paths: reports/junit.xml
          check_name: Vitest
          detailed_summary: true
      - name: Test report summary
        if: always()
        run: |
          {
            echo "### Vitest reports"
            echo ""
            echo "- Test results are published in the **Vitest** check run."
            echo "- Download the **vitest-reports** artifact and open \`html/index.html\` for the HTML report."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check
        run: yarn check
      - name: ArkType AOT check
        run: yarn ark:check
      - name: Lint
        run: yarn lint
      - name: Format check
        run: yarn fmt:check
      - name: OpenTofu format check
        run: tofu fmt -check -recursive infra
      - name: OpenTofu validate (Cloudflare)
        working-directory: infra/cloudflare
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - name: OpenTofu validate (Mailtrap)
        working-directory: infra/mailtrap
        run: |
          tofu init -backend=false -input=false
          tofu validate
