name: Database seed

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "src/db/**"
      - "src/backfills/seed/**"
      - "scripts/fixtures/**"
      - "wrangler.json"
      - ".github/workflows/db-seed.yml"
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "src/db/**"
      - "src/backfills/seed/**"
      - "scripts/fixtures/**"
      - "wrangler.json"
      - ".github/workflows/db-seed.yml"

concurrency:
  group: db-seed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-deps
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
      - name: Database smoke test
        run: bun run db:smoke
