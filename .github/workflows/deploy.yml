name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      pr:
        description: Staging only - PR number to deploy. Leave blank to deploy main.
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}

    steps:
      - name: Resolve deploy ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.environment }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail

          if [ -n "$PR_NUMBER" ] && [ "$TARGET" != "staging" ]; then
            echo "::error::PR deploys are staging-only."
            exit 1
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Deploying main to $TARGET."
            exit 0
          fi

          data=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,isCrossRepository,state \
            --jq '[.headRefOid, .isCrossRepository, .state] | @tsv')
          IFS=$'\t' read -r sha cross_repository state <<< "$data"

          if [ "$cross_repository" = "true" ]; then
            echo "::error::Fork PRs cannot be deployed to staging."
            exit 1
          fi

          if [ "$state" != "OPEN" ]; then
            echo "::error::PR #$PR_NUMBER is not open."
            exit 1
          fi

          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying PR #$PR_NUMBER ($sha) to staging."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: ./.github/actions/setup-deps
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}

      - name: Init OpenTofu
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
        run: doppler run -- tofu -chdir=infra/cloudflare init -input=false

      - name: Generate deploy config
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
        run: |
          doppler run -- tofu -chdir=infra/cloudflare output -json > /tmp/tofu-outputs.json
          python3 scripts/deploy.py render-config \
            --config wrangler.json \
            --outputs /tmp/tofu-outputs.json \
            --env "$DEPLOY_ENV" \
            --out wrangler.generated.json

      - name: Publish Turnstile values to Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_WRITE_TOKEN }}
          DOPPLER_CONFIG: ${{ inputs.environment == 'staging' && 'stg' || 'prd' }}
        run: |
          TURNSTILE_SITE_KEY=$(doppler run -- tofu -chdir=infra/cloudflare output -raw turnstile_site_key)
          TURNSTILE_SECRET=$(doppler run -- tofu -chdir=infra/cloudflare output -raw turnstile_secret)
          DOPPLER_PROJECT=$(awk '/project:/{print $3; exit}' doppler.yaml)
          doppler secrets upload \
            <(python3 scripts/deploy.py turnstile \
                --site "$TURNSTILE_SITE_KEY" \
                --secret "$TURNSTILE_SECRET") \
            --project "$DOPPLER_PROJECT" \
            --config "$DOPPLER_CONFIG" \
            --silent

      - name: Sync Worker secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
        run: |
          if [ "$DEPLOY_ENV" = "staging" ]; then
            ENV_FLAG="--env $DEPLOY_ENV"
          else
            ENV_FLAG=""
          fi
          doppler secrets --json \
            | python3 scripts/deploy.py worker-secrets --env "$DEPLOY_ENV" --config wrangler.generated.json \
            | doppler run -- bunx wrangler secret bulk --config wrangler.generated.json $ENV_FLAG

      - name: Apply D1 migrations
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
          WRANGLER_CONFIG: wrangler.generated.json
        run: doppler run -- bun run db:migrate --target "$DEPLOY_ENV"

      - name: Check deploy configuration
        run: python3 scripts/deploy.py check --env "$DEPLOY_ENV" --config wrangler.generated.json

      - name: Build and deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
          WRANGLER_CONFIG: wrangler.generated.json
        run: |
          if [ "$DEPLOY_ENV" = "staging" ]; then
            CLOUDFLARE_ENV="$DEPLOY_ENV" doppler run -- bunx astro build
          else
            doppler run -- bunx astro build
          fi
          doppler run -- bunx wrangler deploy

      - name: Smoke test staging through Cloudflare Access
        if: env.DEPLOY_ENV == 'staging'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_READ_TOKEN }}
        run: |
          STAGING_URL=$(python3 scripts/deploy.py hostname --env staging --config wrangler.generated.json)
          export STAGING_URL
          doppler run -- bash -c '
            if [ -z "${STAGING_ACCESS_CLIENT_ID:-}" ] || [ -z "${STAGING_ACCESS_CLIENT_SECRET:-}" ]; then
              echo "Skipping: STAGING_ACCESS_CLIENT_ID/SECRET are not set in Doppler."
              exit 0
            fi

            curl --fail --silent --show-error --head \
              --retry 3 --retry-delay 2 \
              -H "CF-Access-Client-Id: $STAGING_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $STAGING_ACCESS_CLIENT_SECRET" \
              "$STAGING_URL"
          '
