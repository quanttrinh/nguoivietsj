name: Setup dependencies
description: Install the aqua-managed CLIs and, when needed, project dependencies.

inputs:
  install-tools:
    description: Install the aqua-managed CLIs (tofu, doppler, node, yarn, ...).
    required: false
    default: "true"
  install-dependencies:
    description: Restore the Yarn package cache and run yarn install.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Restore aqua cache
      if: inputs.install-tools == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.local/share/aquaproj-aqua
        key: aqua-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua/aqua.yaml', 'aqua/registry.yaml', 'aqua/aqua-policy.yaml', 'aqua/aqua-checksums.json') }}
        restore-keys: |
          aqua-${{ runner.os }}-${{ runner.arch }}-

    - name: Install aqua-managed tools
      if: inputs.install-tools == 'true'
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.66.1
        working_directory: aqua
        policy_allow: aqua-policy.yaml
        aqua_opts: ""

    - name: Restore Yarn package cache
      if: inputs.install-dependencies == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .yarn/cache
        key: yarn-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          yarn-packages-${{ runner.os }}-${{ runner.arch }}-

    - name: Install project dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: doppler run -- yarn install --immutable
