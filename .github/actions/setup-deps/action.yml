name: Setup dependencies
description: Install aqua-managed CLIs and project dependencies.

runs:
  using: composite
  steps:
    - name: Restore aqua cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.local/share/aquaproj-aqua
        key: aqua-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua/aqua.yaml', 'aqua/registry.yaml', 'aqua/aqua-policy.yaml', 'aqua/aqua-checksums.json') }}
        restore-keys: |
          aqua-${{ runner.os }}-${{ runner.arch }}-

    - name: Install aqua-managed tools
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.66.1
        working_directory: aqua
        policy_allow: aqua-policy.yaml
        aqua_opts: ""

    - name: Restore Bun package cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-packages-${{ runner.os }}-${{ runner.arch }}-

    - name: Install project dependencies
      shell: bash
      run: doppler run -- bun install --frozen-lockfile
